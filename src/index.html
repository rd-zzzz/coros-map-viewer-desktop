    <script>
    (function () {
        "use strict";

        /* ============================================================
           Controls Panel Collapse
        ============================================================ */
        var controlsBody = document.getElementById("controls-body");
        var collapseIcon = document.querySelector("#controls-toggle .collapse-icon");
        document.getElementById("controls-toggle").onclick = function () {
            controlsBody.classList.toggle("collapsed");
            collapseIcon.classList.toggle("collapsed");
        };

        /* ============================================================
           Theme Toggle
        ============================================================ */
        var themeCheckbox = document.getElementById("theme-toggle");
        // 默认浅色户外主题（对齐 COROS 手表外观）；v2 键忽略早期版本残留的 dark
        var savedTheme = localStorage.getItem("mapviewer-theme-v2") || "light";
        if (savedTheme === "light") {
            document.body.classList.add("light-theme");
            themeCheckbox.checked = true;
        }

        themeCheckbox.addEventListener("change", function () {
            var isLight = themeCheckbox.checked;
            document.body.classList.toggle("light-theme", isLight);
            localStorage.setItem("mapviewer-theme-v2", isLight ? "light" : "dark");
            if (map && map.getStyle()) applyPalette(isLight ? "light" : "dark");
        });

        /* ============================================================
           Tauri Window Controls
        ============================================================ */
        var appWindow = null;
        try {
            if (window.__TAURI__ && window.__TAURI__.window) {
                appWindow = window.__TAURI__.window.getCurrentWindow();
            }
        } catch (e) {}

        if (appWindow) {
            document.getElementById("btn-min").onclick = function () { appWindow.minimize(); };
            document.getElementById("btn-max").onclick = function () { appWindow.toggleMaximize(); };
            document.getElementById("btn-close").onclick = function () { appWindow.close(); };
        }

        /* ============================================================
           Debug Logger
        ============================================================ */
        var debugContent = document.getElementById("debug-content");
        var debugToggle = document.getElementById("debug-toggle");
        var debugPanel = document.getElementById("debug-panel");
        var debugVisible = false;
        var debugLines = [];

        debugToggle.onclick = function () {
            debugVisible = !debugVisible;
            debugPanel.style.display = debugVisible ? "block" : "none";
            debugToggle.classList.toggle("active", debugVisible);
        };

        document.getElementById("btn-clear-log").onclick = function () {
            debugLines = [];
            debugContent.innerHTML = "";
        };

        function dbg(msg, cls) {
            var ts = new Date().toLocaleTimeString();
            var errLine = cls === "dbg-err" ? " dbg-err-line" : (cls === "dbg-warn" ? " dbg-warn-line" : "");
            debugLines.push('<div class="dbg-line' + errLine + '"><span class="dbg-ts">[' + ts + "]</span><span class=\"" + (cls || "dbg-info") + "\">" + escapeHtml(msg) + "</span></div>");
            if (debugLines.length > 80) debugLines.shift();
            debugContent.innerHTML = debugLines.join("");
            debugContent.scrollTop = debugContent.scrollHeight;
        }

        dbg("pmtiles: " + (typeof pmtiles === "object" ? "OK" : "MISSING"), typeof pmtiles === "object" ? "dbg-ok" : "dbg-err");
        dbg("Protocol: " + (typeof pmtiles.Protocol === "function" ? "OK" : "MISSING"), typeof pmtiles.Protocol === "function" ? "dbg-ok" : "dbg-err");

        /* ============================================================
           State
        ============================================================ */
        var allEntries = [];
        var loadedSources = {};
        var vcmVisible = true;
        var MAX_ACTIVE_SOURCES = 24;
        var loadingActive = false;
        var accumulatedFiles = [];
        var accumulatedNames = {};
        // P1-3: 缓存的「可 hover 图层」id 列表与当前光标状态，供合并后的 mousemove 使用
        var hoverableLayers = [];
        var lastCursor = "";

        /* ============================================================
           Status Bar Helpers
        ============================================================ */
        var sbCoords = document.getElementById("sb-coords");
        var sbTile = document.getElementById("sb-tile");
        var sbDot = document.getElementById("sb-dot");
        var sbStatus = document.getElementById("sb-status");

        function setLoading(loading, text) {
            loadingActive = loading;
            sbDot.className = loading ? "sb-dot loading" : "sb-dot";
            if (text) sbStatus.textContent = text;
        }

        /* ============================================================
           Protocol
        ============================================================ */
        var protocol = new pmtiles.Protocol({ metadata: true });
        maplibregl.addProtocol("pmtiles", protocol.tile);
        dbg("Protocol registered", "dbg-ok");

        // P0-2: pmtiles 4.x 的 Protocol 没有 remove()——实测 typeof 为 undefined，
        // 而内部 tiles 是无上限的 Map。原来的 protocol.remove(key) 每次都抛 TypeError
        // 并被空 catch 吞掉，PMTiles 实例（含目录缓存）因此全会话驻留，「清除所有」
        // 也回收不掉。直接删 tiles 里的条目是唯一的回收路径。
        function releaseProtocol(key) {
            try {
                if (protocol.tiles && typeof protocol.tiles.delete === "function") {
                    protocol.tiles.delete(key);
                }
            } catch (e) {}
        }

        /* ============================================================
           Semantic Palettes — 必须早于 Map Init：初始背景色与各语义
           图层构建器都要读取它（var 提升只给声明、不给赋值，放后面
           会在初始化时拿到 undefined 并中断整个脚本）。
        ============================================================ */
        var PALETTES = {
            light: {
                bg: "#f0f2f8",
                forest: "#d3e9c4",        // F E1 野生林地
                farm: "#f0f1dd",          // F E4 农田
                park: "#7fc9bf",          // F E7 城市公园/绿地（teal）
                railcorridor: "#e9e8e4",  // F E2 铁路走廊
                water: "#87c8d4",         // N 水体
                protected: "#d6ecc6",     // I 保护区
                airport: "#e5e6ea",       // B 机场用地
                airportLine: "#b6b8bf",
                roadArea: "#e9e7e0",      // L 道路面 polygon（暖灰，与冷色 bg 可分）
                motorway: "#f6c39c", motorwayCasing: "#d98f4f",   // L E7,20
                arterial: "#f8d3b4", arterialCasing: "#e0a56f",   // L E8,9
                secondary: "#ffffff", secondaryCasing: "#a4a9b3", secondaryLow: "#c4c8cf", // L E10
                local: "#ffffff", localCasing: "#b6b9c0", localLow: "#d2d5d9",             // L E11-14,23
                path: "#9da2aa",          // L E0 小路（弱化，不得压过道路铺面）
                trail: "#73767e",         // L E29 登山步道（中灰虚线，非黑色）
                rail: "#74777e",          // L E2 铁路
                transit: "#3a86d1",       // L E3 地铁/BRT
                waterLine: "#5cb1c2",     // P/O 水系线
                roadLabel: "#3d3d43",
                poiLabel: "#a1413c",
                placeLabel: "#9b403b",
                peakLabel: "#5c4c3c",
                halo: "#ffffff",
                contourMinor: "#d9c3a4", contourIndex: "#c49a6e"
            },
            dark: {
                bg: "#15151f",
                forest: "#263d22",
                farm: "#2d2f23",
                park: "#2c6e68",
                railcorridor: "#23232b",
                water: "#2a5d6f",
                protected: "#293e25",
                airport: "#26272e",
                airportLine: "#55575f",
                roadArea: "#2a2a32",
                motorway: "#9a683d", motorwayCasing: "#6e4726",
                arterial: "#8a6342", arterialCasing: "#66492e",
                secondary: "#454854", secondaryCasing: "#21232b", secondaryLow: "#2e3038",
                local: "#3d404a", localCasing: "#202129", localLow: "#33353d",
                path: "#888b93",
                trail: "#8f929c",
                rail: "#8a8d95",
                transit: "#5aa0e0",
                waterLine: "#4d93a8",
                roadLabel: "#d4d5db",
                poiLabel: "#e08a84",
                placeLabel: "#dd867f",
                peakLabel: "#c8b39c",
                halo: "#14141c",
                contourMinor: "#7a6a52", contourIndex: "#9a7d5a"
            }
        };

        /* ============================================================
           Map Init
        ============================================================ */
        var isLightTheme = savedTheme === "light";
        var initialPalette = PALETTES[isLightTheme ? "light" : "dark"];
        var map = new maplibregl.Map({
            container: "map",
            minZoom: 8,
            center: [108, 34],
            zoom: 9.5,
            attributionControl: false,
            style: {
                version: 8,
                glyphs: "fonts/{fontstack}/{range}.pbf",
                sprite: "sprites/coros/sprite",
                sources: {},
                layers: [{
                    id: "background",
                    type: "background",
                    paint: { "background-color": initialPalette.bg }
                }]
            }
        });

        /* ============================================================
           Zoom Widget
        ============================================================ */
        var zoomValueEl = document.getElementById("zoom-value");
        var scaleTextEl = document.getElementById("scale-text");

        document.getElementById("zoom-in").onclick = function () { map.zoomIn(); };
        document.getElementById("zoom-out").onclick = function () { map.zoomOut(); };

        map.on("zoom", function () {
            var z = map.getZoom();
            zoomValueEl.textContent = "Z " + z.toFixed(2);
            document.getElementById("stat-zoom").textContent = "Z" + z.toFixed(1);
            updateScaleBar();
        });
        map.on("move", function () { updateScaleBar(); });

        function updateScaleBar() {
            var center = map.getCenter();
            var mpp = 156543.03392 * Math.cos(center.lat * Math.PI / 180) / Math.pow(2, map.getZoom());
            var targetWidth = 60;
            var realWidth = mpp * targetWidth;
            var dist = formatDistance(realWidth);
            scaleTextEl.textContent = dist;
        }
        function formatDistance(m) {
            if (m >= 1000) return (m / 1000).toFixed(1) + " km";
            if (m >= 100) return Math.round(m) + " m";
            if (m >= 10) return Math.round(m) + " m";
            return m.toFixed(1) + " m";
        }

        map.on("load", function () { dbg("Map ready", "dbg-ok"); });
        map.on("error", function (e) {
            var msg = e.error ? (e.error.message || String(e.error)) : JSON.stringify(e);
            dbg("ERR: " + msg, "dbg-err");
        });

        /* ============================================================
           Status Bar: Coordinates
        ============================================================ */
        // P1-3: 坐标显示与 hover 检测合并为同一个监听器（原有两个 mousemove，
        // 各自做一次无层过滤的 queryRenderedFeatures）。这里只在缓存的非 fill 图层上
        // 查询一次，且仅当命中结果变化时才改光标，避免每帧无谓地写样式。
        map.on("mousemove", function (e) {
            var ll = e.lngLat;
            sbCoords.textContent = ll.lat.toFixed(4) + ", " + ll.lng.toFixed(4);
            var z = Math.floor(map.getZoom());
            if (z >= 0) {
                var tx = Math.floor((ll.lng + 180) / 360 * Math.pow(2, z));
                var latRad = ll.lat * Math.PI / 180;
                var ty = Math.floor((1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * Math.pow(2, z));
                sbTile.textContent = z + "/" + Math.max(0, tx) + "/" + Math.max(0, ty);
            }
            var want = "";
            if (hoverableLayers.length) {
                want = map.queryRenderedFeatures(e.point, { layers: hoverableLayers }).length ? "pointer" : "";
            }
            if (want !== lastCursor) {
                lastCursor = want;
                map.getCanvas().style.cursor = want;
            }
        });

        /* ============================================================
           Utilities
        ============================================================ */
        function boundsIntersect(a, b) {
            return a[0] <= b[2] && a[2] >= b[0] && a[1] <= b[3] && a[3] >= b[1];
        }

        // S1: 所有写入 innerHTML 的动态文本必须经此转义，防止不可信 PMTiles 属性注入脚本
        function escapeHtml(s) {
            return String(s == null ? "" : s)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        // O1: 两个包围盒的相交面积，用于按覆盖视口大小排序源
        function intersectArea(a, b) {
            var w = Math.min(a[2], b[2]) - Math.max(a[0], b[0]);
            var h = Math.min(a[3], b[3]) - Math.max(a[1], b[1]);
            return (w > 0 && h > 0) ? w * h : 0;
        }

        // O5: 复制文本，navigator.clipboard 不可用时回退到 execCommand
        function copyText(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                return navigator.clipboard.writeText(text);
            }
            var ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            var ok = false;
            try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
            document.body.removeChild(ta);
            return Promise.resolve(ok);
        }

        function colorForIndex(i) {
            return "hsl(" + Math.round((i * 137.508) % 360) + ", 65%, 58%)";
        }

        function detectType(file) {
            var path = file.webkitRelativePath || file._dropPath || "";
            if (/[/\\]VCM[/\\]/i.test(path)) return "vcm";
            if (/[/\\]VSM[/\\]/i.test(path)) return "vsm";
            if (/^C\d/i.test(file.name)) return "vcm";
            if (/^S\d/i.test(file.name)) return "vsm";
            if (file.name.toLowerCase().endsWith(".pmtiles")) return "generic";
            return null;
        }

        function yieldUI() {
            return new Promise(function (r) { setTimeout(r, 0); });
        }

        // P1-5: 两条通道的文件标识口径天生不同——文件夹通道只能拿到 webkitRelativePath
        // （浏览器 File API 不暴露绝对路径），拖拽通道拿到的是完整磁盘路径，
        // 直接字符串相等比较会让「先选文件夹、再拖入同一文件夹」把同一文件索引两次。
        // 这里统一为「归一化后互为路径后缀」判定：先抹平分隔符与大小写差异，
        // 再判断其中一方是否以「/ + 另一方」结尾。
        function normalizePathKey(p) {
            return String(p == null ? "" : p).replace(/\\/g, "/").toLowerCase();
        }

        function isKnownPath(key) {
            if (accumulatedNames[key]) return true;
            for (var k in accumulatedNames) {
                if (k.length > key.length) {
                    if (k.slice(-key.length - 1) === "/" + key) return true;
                } else if (key.length > k.length) {
                    if (key.slice(-k.length - 1) === "/" + k) return true;
                }
            }
            return false;
        }

        /* ============================================================
           Lazy DiskSource — reads bytes from local files via Rust IPC
        ============================================================ */
        function DiskSource(path) {
            this._path = path;
        }
        DiskSource.prototype.getKey = function () { return this._path; };
        DiskSource.prototype.getBytes = function (offset, length) {
            return window.__TAURI__.core.invoke("read_file_slice", {
                path: this._path, offset: offset, length: length
            }).then(function (b64) {
                // P1-1: Rust 端返回 base64 文本（见 lib.rs 注释的原因），此处还原成 ArrayBuffer
                return { data: base64ToArrayBuffer(b64) };
            });
        };

        // P1-1: base64 → ArrayBuffer。保持 ES5 写法（无 Buffer / TextDecoder 依赖）
        function base64ToArrayBuffer(b64) {
            var bin = "";
            try { bin = atob(b64); } catch (e) { bin = ""; }
            var len = bin.length;
            var bytes = new Uint8Array(len);
            for (var i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
            return bytes.buffer;
        }

        /* ============================================================
           Semantic Style — Draw Order & Layer Builders
           （PALETTES 已前移至 Map Init 之前）
           ------------------------------------------------------------
           VSM 图层语义（经真实瓦片解码确认）：
             L 道路(线+面, E 分级)   K POI(点, E 分类)   J 行政地名(点)
             P 低zoom 水系线   O 高zoom 水系线   H 山峰(点)   A 机场点
             F 地表覆盖(面)   N 水体(面)   B 机场用地(线+面)   I 保护区(面)
           VCM：Q 等高线，F=高程。
           浅色主题对齐 COROS 手表：近白淡紫底、teal 绿地/水体、peach 主干道、
           白色次路（灰 casing 勾边）、暗红地名、深灰路名、蓝色圆形 POI 图标、
           公园中灰虚步道（步道/小路刻意弱于道路铺面）。
        ============================================================ */
        // PALETTES 定义已前移至 Map Init 之前（初始化即需读取）。

        // 绘制槽位：数组顺序即从底到顶；多源图层按槽位全局重排
        var SLOT_ORDER = [
            "landcover", "water", "protected", "airportfill", "roadarea", "contour",
            "casing-local", "fill-local", "casing-secondary", "fill-secondary",
            "casing-arterial", "fill-arterial", "casing-motorway", "fill-motorway",
            "path", "trail", "rail", "transit", "waterline", "airportline",
            "airport-icon", "peak-icon", "poi-icon",
            "road-label", "peak-label", "poi-label", "place-label"
        ];
        var layerSlotMap = {};

        function currentThemeName() {
            return document.body.classList.contains("light-theme") ? "light" : "dark";
        }

        function addTagged(ctx, spec, slot) {
            map.addLayer(spec);
            layerSlotMap[spec.id] = slot;
            ctx.ids.push(spec.id);
        }

        function bindPaint(ctx, id, prop, make) {
            ctx.bindings.push({ id: id, prop: prop, make: make });
        }

        // moveLayer 无第二参数时移到最顶；按槽位自底向顶遍历即得到全局正确叠放顺序
        function reorderLayers() {
            for (var s = 0; s < SLOT_ORDER.length; s++) {
                var slot = SLOT_ORDER[s];
                for (var id in layerSlotMap) {
                    if (layerSlotMap[id] === slot && map.getLayer(id)) map.moveLayer(id);
                }
            }
        }

        // P1-3: hover 查询限定在「非 fill」图层上——大面积的地表/水体 fill 会让指针在
        // 任意位置都显示 pointer，排除它们既让光标语义更准，也缩小查询范围。
        // 列表缓存，仅在源增删时重建，避免每次鼠标移动遍历全部图层。
        function refreshHoverableLayers() {
            hoverableLayers = [];
            for (var id in layerSlotMap) {
                var lyr = map.getLayer(id);
                if (lyr && lyr.type !== "fill") hoverableLayers.push(id);
            }
        }

        function applyPalette(name) {
            var p = PALETTES[name];
            try { map.setPaintProperty("background", "background-color", p.bg); } catch (e) {}
            for (var sn in loadedSources) {
                var bs = loadedSources[sn].bindings || [];
                for (var i = 0; i < bs.length; i++) {
                    try { map.setPaintProperty(bs[i].id, bs[i].prop, bs[i].make(p)); } catch (e) {}
                }
            }
        }

        /* ---------- 表达式助手 ---------- */

        function landcoverExpr(p) {
            return ["match", ["get", "E"],
                1, p.forest,
                4, p.farm,
                7, p.park,
                2, p.railcorridor,
                "rgba(0,0,0,0)"];
        }

        // 低 zoom 呈浅灰细线、高 zoom 呈白色铺面
        function lowHighExpr(p, lowKey, highKey, z0, z1) {
            return ["interpolate", ["linear"], ["zoom"], z0, p[lowKey], z1, p[highKey]];
        }

        // K POI E 分类 → 图标名（图标精灵 src/sprites/coros 为统一蓝色圆形）
        var POI_ICON_EXPR = ["match", ["get", "E"],
            1, "convenience", 4, "golf", 5, "fast_food", 6, "park",
            7, "bus_stop", 8, "train_station", 11, "campsite",
            13, "supermarket", 19, "cafe", 22, "bar",
            24, "dot", 25, "hospital", 26, "dot",
            27, "attraction", 30, "stadium", 36, "fuel", 52, "parking",
            "dot"];

        /* ---------- VSM 各图层 ---------- */

        function buildVSMLayers(sn, vl, p, ctx) {
            var have = {};
            for (var h = 0; h < vl.length; h++) have[vl[h].id] = true;

            // F 地表覆盖
            if (have.F) {
                var idf = sn + "_landcover";
                addTagged(ctx, { id: idf, source: sn, "source-layer": "F", type: "fill",
                    filter: ["==", ["geometry-type"], "Polygon"],
                    paint: { "fill-color": landcoverExpr(p) } }, "landcover");
                bindPaint(ctx, idf, "fill-color", landcoverExpr);
            }

            // N 水体
            if (have.N) {
                var idn = sn + "_water";
                addTagged(ctx, { id: idn, source: sn, "source-layer": "N", type: "fill",
                    filter: ["==", ["geometry-type"], "Polygon"],
                    paint: { "fill-color": p.water } }, "water");
                bindPaint(ctx, idn, "fill-color", function (pp) { return pp.water; });
            }

            // I 保护区
            if (have.I) {
                var idi = sn + "_protected";
                addTagged(ctx, { id: idi, source: sn, "source-layer": "I", type: "fill",
                    filter: ["==", ["geometry-type"], "Polygon"],
                    paint: { "fill-color": p.protected } }, "protected");
                bindPaint(ctx, idi, "fill-color", function (pp) { return pp.protected; });
            }

            // B 机场用地
            if (have.B) {
                var idb = sn + "_airportfill";
                addTagged(ctx, { id: idb, source: sn, "source-layer": "B", type: "fill",
                    filter: ["==", ["geometry-type"], "Polygon"],
                    paint: { "fill-color": p.airport } }, "airportfill");
                bindPaint(ctx, idb, "fill-color", function (pp) { return pp.airport; });

                var idbl = sn + "_airportline";
                addTagged(ctx, { id: idbl, source: sn, "source-layer": "B", type: "line",
                    filter: ["==", ["geometry-type"], "LineString"],
                    paint: { "line-color": p.airportLine, "line-width": 1 } }, "airportline");
                bindPaint(ctx, idbl, "line-color", function (pp) { return pp.airportLine; });
            }

            // L 道路
            if (have.L) buildRoadLayers(sn, p, ctx);

            // P / O 水系线
            if (have.P) buildWaterLineLayer(sn, "P", p, ctx, 8, 0.5, 13, 1.2);
            if (have.O) buildWaterLineLayer(sn, "O", p, ctx, 12, 0.8, 14, 1.4);

            // K POI
            if (have.K) buildPOILayers(sn, p, ctx);

            // J 行政地名
            if (have.J) buildPlaceLayers(sn, p, ctx);

            // H 山峰
            if (have.H) buildPeakLayers(sn, p, ctx);

            // A 机场点
            if (have.A) {
                var ida = sn + "_airport";
                addTagged(ctx, { id: ida, source: sn, "source-layer": "A", type: "symbol",
                    filter: ["==", ["geometry-type"], "Point"],
                    layout: { "icon-image": "aerodrome",
                        "icon-size": ["interpolate", ["linear"], ["zoom"], 8, 0.6, 14, 0.9] } },
                    "airport-icon");
            }
        }

        function buildRoadLayers(sn, p, ctx) {
            // 道路面 polygon（E4/5 等）
            var ida = sn + "_roadarea";
            addTagged(ctx, { id: ida, source: sn, "source-layer": "L", type: "fill",
                filter: ["==", ["geometry-type"], "Polygon"],
                paint: { "fill-color": p.roadArea } }, "roadarea");
            bindPaint(ctx, ida, "fill-color", function (pp) { return pp.roadArea; });

            function width(z0, v0, z1, v1) {
                return ["interpolate", ["linear"], ["zoom"], z0, v0, z1, v1];
            }
            function color(key) {
                return function (pp) { return pp[key]; };
            }
            function line(suffix, slot, classFilter, colorMake, widthExpr, dash) {
                var id = sn + "_" + suffix;
                // line-cap / line-join 是 LAYOUT 属性，放 paint 会校验失败、整层被跳过
                var layout = { "line-cap": "round", "line-join": "round" };
                var paint = { "line-color": colorMake(p), "line-width": widthExpr };
                if (dash) paint["line-dasharray"] = dash;
                addTagged(ctx, { id: id, source: sn, "source-layer": "L", type: "line",
                    filter: ["all", ["==", ["geometry-type"], "LineString"], classFilter],
                    layout: layout, paint: paint }, slot);
                bindPaint(ctx, id, "line-color", colorMake);
            }

            // 过滤器统一用新表达式语法（["get","E"] / ["in",needle,literal]）：
            // 旧式 ["in","E",...]、["==","E",10] 会让整个 ["all"] 被按 legacy
            // 解析，而其中 ["geometry-type"] 子表达式不合法，导致整层校验失败。
            var LOCAL_ES = ["literal", [11, 12, 14, 15, 16, 21, 22, 23]];
            var MOTORWAY_ES = ["literal", [7, 19, 20]];
            // E13 的 i19/i23 是公园步道/步行街，归 trail；其余 E13 才是普通支路
            var PEDESTRIAN_I = ["literal", [19, 23]];
            var localRoadFilter = ["any",
                ["in", ["get", "E"], LOCAL_ES],
                ["all", ["==", ["get", "E"], 13],
                    ["!", ["in", ["coalesce", ["get", "i"], -1], PEDESTRIAN_I]]]];

            // 自下而上：支路 → 次干 → 主干 → 高速（高等级道路在交叉处压过下级）
            line("casing-local", "casing-local", localRoadFilter,
                color("localCasing"), width(13, 1.3, 16, 3.7));
            line("fill-local", "fill-local", localRoadFilter,
                function (pp) { return lowHighExpr(pp, "localLow", "local", 13, 15); },
                width(13, 0.9, 16, 2.9));
            line("casing-secondary", "casing-secondary", ["==", ["get", "E"], 10],
                color("secondaryCasing"), width(13, 2.2, 16, 4.8));
            line("fill-secondary", "fill-secondary", ["==", ["get", "E"], 10],
                function (pp) { return lowHighExpr(pp, "secondaryLow", "secondary", 12.5, 14.5); },
                width(13, 1.5, 16, 3.9));
            line("casing-arterial", "casing-arterial", ["in", ["get", "E"], ["literal", [8, 9]]],
                color("arterialCasing"), width(12, 2.6, 15, 6));
            line("fill-arterial", "fill-arterial", ["in", ["get", "E"], ["literal", [8, 9]]],
                color("arterial"), width(12, 2, 15, 5));
            line("casing-motorway", "casing-motorway", ["in", ["get", "E"], MOTORWAY_ES],
                color("motorwayCasing"), width(12, 4, 15, 7.8));
            line("fill-motorway", "fill-motorway", ["in", ["get", "E"], MOTORWAY_ES],
                color("motorway"), width(12, 3.2, 15, 6.6));
            line("path", "path", ["==", ["get", "E"], 0],
                color("path"), width(12, 0.5, 15, 1.1));
            line("trail", "trail",
                ["any", ["==", ["get", "E"], 29],
                    ["all", ["==", ["get", "E"], 13],
                        ["in", ["coalesce", ["get", "i"], -1], PEDESTRIAN_I]]],
                color("trail"), width(12, 0.6, 15, 1.3), [1.3, 0.9]);
            line("rail", "rail", ["==", ["get", "E"], 2],
                color("rail"), width(10, 0.5, 14, 1.3), [2.4, 1.6]);
            line("transit", "transit", ["==", ["get", "E"], 3],
                color("transit"), width(11, 0.6, 14, 1.6));

            // 道路名（沿道路走向）
            var idl = sn + "_roadlabel";
            addTagged(ctx, { id: idl, source: sn, "source-layer": "L", type: "symbol",
                filter: ["all", ["==", ["geometry-type"], "LineString"],
                    ["any", ["has", "X"], ["has", "name"]]],
                minzoom: 11.5,
                layout: { "symbol-placement": "line",
                    "text-field": ["coalesce", ["get", "name"], ["get", "X"]],
                    "text-font": ["Noto Sans Regular"],
                    "text-size": ["match", ["get", "E"],
                        7, 11, 19, 11, 20, 11, 8, 10.5, 9, 10.5, 10, 10, 9.5],
                    "symbol-spacing": 280 },
                paint: { "text-color": p.roadLabel, "text-halo-color": p.halo,
                    "text-halo-width": 1.6 } }, "road-label");
            bindPaint(ctx, idl, "text-color", function (pp) { return pp.roadLabel; });
            bindPaint(ctx, idl, "text-halo-color", function (pp) { return pp.halo; });
        }

        function buildWaterLineLayer(sn, layer, p, ctx, z0, v0, z1, v1) {
            var id = sn + "_" + layer + "_wline";
            addTagged(ctx, { id: id, source: sn, "source-layer": layer, type: "line",
                filter: ["==", ["geometry-type"], "LineString"],
                paint: { "line-color": p.waterLine,
                    "line-width": ["interpolate", ["linear"], ["zoom"], z0, v0, z1, v1] } },
                "waterline");
            bindPaint(ctx, id, "line-color", function (pp) { return pp.waterLine; });
        }

        function buildPOILayers(sn, p, ctx) {
            var id = sn + "_poi";
            addTagged(ctx, { id: id, source: sn, "source-layer": "K", type: "symbol",
                filter: ["all", ["==", ["geometry-type"], "Point"], ["has", "E"]],
                layout: { "icon-image": POI_ICON_EXPR,
                    "icon-size": ["interpolate", ["linear"], ["zoom"], 12, 0.62, 14, 0.82],
                    "icon-allow-overlap": false } }, "poi-icon");

            var idl = sn + "_poilabel";
            addTagged(ctx, { id: idl, source: sn, "source-layer": "K", type: "symbol",
                filter: ["all", ["==", ["geometry-type"], "Point"],
                    ["any", ["has", "X"], ["has", "name"]]],
                minzoom: 13,
                layout: { "text-field": ["coalesce", ["get", "name"], ["get", "X"]],
                    "text-font": ["Noto Sans Regular"],
                    "text-size": ["interpolate", ["linear"], ["zoom"], 13, 9.5, 14, 11],
                    "text-offset": [0, 1.4] },
                paint: { "text-color": p.poiLabel, "text-halo-color": p.halo,
                    "text-halo-width": 1.5 } }, "poi-label");
            bindPaint(ctx, idl, "text-color", function (pp) { return pp.poiLabel; });
            bindPaint(ctx, idl, "text-halo-color", function (pp) { return pp.halo; });
        }

        function buildPlaceLayers(sn, p, ctx) {
            var id = sn + "_places";
            addTagged(ctx, { id: id, source: sn, "source-layer": "J", type: "symbol",
                filter: ["==", ["geometry-type"], "Point"],
                layout: { "text-field": ["coalesce", ["get", "name"], ["get", "X"]],
                    "text-font": ["Noto Sans Regular"],
                    "text-size": ["match", ["get", "E"],
                        5, 13.5,
                        6, 11.5,
                        10, 10.5, 11, 10.5, 16, 10.5,
                        7, 9.5, 8, 9.5, 12, 9.5,
                        10] },
                paint: { "text-color": p.placeLabel, "text-halo-color": p.halo,
                    "text-halo-width": 1.8 } }, "place-label");
            bindPaint(ctx, id, "text-color", function (pp) { return pp.placeLabel; });
            bindPaint(ctx, id, "text-halo-color", function (pp) { return pp.halo; });
        }

        function buildPeakLayers(sn, p, ctx) {
            var id = sn + "_peakicon";
            addTagged(ctx, { id: id, source: sn, "source-layer": "H", type: "symbol",
                filter: ["==", ["geometry-type"], "Point"],
                layout: { "icon-image": "peak",
                    "icon-size": ["interpolate", ["linear"], ["zoom"], 11, 0.6, 14, 0.85] } },
                "peak-icon");

            var idl = sn + "_peaklabel";
            addTagged(ctx, { id: idl, source: sn, "source-layer": "H", type: "symbol",
                filter: ["==", ["geometry-type"], "Point"],
                minzoom: 11.5,
                layout: { "text-field": ["coalesce", ["get", "name"], ["to-string", ["get", "F"]]],
                    "text-font": ["Noto Sans Regular"], "text-size": 10 },
                paint: { "text-color": p.peakLabel, "text-halo-color": p.halo,
                    "text-halo-width": 1.5 } }, "peak-label");
            bindPaint(ctx, idl, "text-color", function (pp) { return pp.peakLabel; });
            bindPaint(ctx, idl, "text-halo-color", function (pp) { return pp.halo; });
        }

        /* ---------- VCM 等高线 ---------- */

        function buildVCMLayers(sn, vl, p, ctx) {
            var have = {};
            for (var h = 0; h < vl.length; h++) have[vl[h].id] = true;
            if (!have.Q) return;

            // P0-1: 这里不再使用 feature-state。实测 36 个 z11 瓦片里 Q 层 43 个要素
            // 只有 5 个不同高程值（F=600 跨 15 个瓦片），而 MapLibre 的 feature-state
            // 以 (sourceLayer, id) 为键且跨瓦片生效——hover 一条等高线会点亮整个 source
            // 内所有同高程线。高程天然不唯一，无法充当要素 id，故 VCM 不提供 hover 高亮，
            // 仅保留点击属性面板（不依赖要素 id）。
            var id0 = sn + "_contour";
            addTagged(ctx, { id: id0, source: sn, "source-layer": "Q", type: "line",
                filter: ["!=", ["%", ["get", "F"], 50], 0],
                paint: { "line-color": p.contourMinor,
                    "line-width": ["interpolate", ["linear"], ["zoom"], 9, 0.4, 13, 0.8],
                    "line-opacity": 0.75 } },
                "contour");
            bindPaint(ctx, id0, "line-color", function (pp) { return pp.contourMinor; });

            var id1 = sn + "_contour-index";
            addTagged(ctx, { id: id1, source: sn, "source-layer": "Q", type: "line",
                filter: ["==", ["%", ["get", "F"], 50], 0],
                paint: { "line-color": p.contourIndex,
                    "line-width": ["interpolate", ["linear"], ["zoom"], 9, 0.7, 13, 1.4],
                    "line-opacity": 0.9 } },
                "contour");
            bindPaint(ctx, id1, "line-color", function (pp) { return pp.contourIndex; });
        }

        /* ---------- Generic PMTiles 回退（保留随机配色诊断风格） ---------- */

        function buildGenericLayers(sn, vl, p, ctx) {
            for (var i = 0; i < vl.length; i++) {
                (function (idx) {
                    var lid = vl[idx].id;
                    var c = colorForIndex(idx);
                    var pfx = sn + "_" + lid;

                    addTagged(ctx, { id: pfx + "_fill", source: sn, "source-layer": lid, type: "fill",
                        filter: ["==", ["geometry-type"], "Polygon"],
                        paint: { "fill-color": c, "fill-opacity": 0.25 } }, "landcover");

                    addTagged(ctx, { id: pfx + "_line", source: sn, "source-layer": lid, type: "line",
                        filter: ["==", ["geometry-type"], "LineString"],
                        paint: { "line-color": c, "line-width": 1.5 } }, "waterline");

                    addTagged(ctx, { id: pfx + "_outline", source: sn, "source-layer": lid, type: "line",
                        filter: ["==", ["geometry-type"], "Polygon"],
                        paint: { "line-color": c, "line-width": 0.5, "line-opacity": 0.5 } }, "waterline");

                    addTagged(ctx, { id: pfx + "_circle", source: sn, "source-layer": lid, type: "circle",
                        filter: ["==", ["geometry-type"], "Point"],
                        paint: { "circle-color": c,
                            "circle-radius": ["interpolate", ["linear"], ["zoom"], 8, 2, 14, 5],
                            "circle-stroke-color": p.airportLine, "circle-stroke-width": 1 } }, "poi-icon");
                    // 清理项: 随机色 c 与主题无关无需绑定，但描边/文字取自调色板，
                    // 原来漏了 bindPaint，切主题后这些颜色会停留在旧值
                    bindPaint(ctx, pfx + "_circle", "circle-stroke-color", function (pp) { return pp.airportLine; });

                    addTagged(ctx, { id: pfx + "_label", source: sn, "source-layer": lid, type: "symbol",
                        filter: ["any", ["==", ["geometry-type"], "Point"], ["==", ["geometry-type"], "Polygon"]],
                        layout: { "text-field": ["coalesce", ["get", "name"], ["get", "X"]],
                            "text-font": ["Noto Sans Regular"],
                            "text-size": ["interpolate", ["linear"], ["zoom"], 8, 7, 14, 12] },
                        paint: { "text-color": p.roadLabel, "text-halo-color": p.halo,
                            "text-halo-width": 1.5 } }, "place-label");
                    bindPaint(ctx, pfx + "_label", "text-color", function (pp) { return pp.roadLabel; });
                    bindPaint(ctx, pfx + "_label", "text-halo-color", function (pp) { return pp.halo; });
                })(i);
            }
        }

        /* ============================================================
           Load / Unload
        ============================================================ */
        function loadEntry(entry) {
            var sn = entry.sourceName;
            var source = entry.diskPath ? new DiskSource(entry.diskPath) : new pmtiles.FileSource(entry.file);
            var inst = new pmtiles.PMTiles(source);
            protocol.add(inst);
            var key = inst.source.getKey();

            var vl = (entry.meta && entry.meta.vector_layers) ? entry.meta.vector_layers : [];
            var isVCM = entry.type === "vcm";
            var ctx = { ids: [], bindings: [] };

            // H2: promoteId 让 MVT 要素获得数字 id，供 feature-state 使用。
            // P0-1: VCM 不再提升 F——实测 z11 瓦片里 Q 层 43 个要素只有 5 个高程值
            // （F=600 跨 15 个瓦片），feature-state 以 (sourceLayer, id) 为键且跨瓦片生效，
            // 提升 F 会让 hover 一条等高线点亮整个 source 内所有同高程线。等高线已无
            // feature-state 图层，保留 promoteId 只会制造重复 id，故置空。
            // VSM/generic 仍按 source-layer 提升 E（缺失则 id 为空，无副作用）。
            var promoteId = null;
            if (!isVCM) {
                var pidMap = {};
                for (var pp = 0; pp < vl.length; pp++) pidMap[vl[pp].id] = "E";
                promoteId = pidMap;
            }

            // H1: 整体包在 try 内，中途失败就地清理已建图层/源/协议，避免孤儿资源。
            var sourceAdded = false;
            try {
                map.addSource(sn, { type: "vector", url: "pmtiles://" + key, promoteId: promoteId });
                sourceAdded = true;

                var pal = PALETTES[currentThemeName()];
                if (isVCM) {
                    buildVCMLayers(sn, vl, pal, ctx);
                } else if (entry.type === "vsm") {
                    buildVSMLayers(sn, vl, pal, ctx);
                } else {
                    buildGenericLayers(sn, vl, pal, ctx);
                }
                // P1-2: 全局重排已从此处移出——每个 VSM 源有 27 层、最多 24 个源，
                // 放在 loadEntry 内会变成每层一次全量 moveLayer（单次刷新约 7800 次）。
                // 现改为在 updateViewport() 末尾对整批只做一次。

                loadedSources[sn] = { ids: ctx.ids, bindings: ctx.bindings, type: entry.type, key: key };
            } catch (e) {
                // H1: 加载中途失败，移除已建图层后再删 source（顺序不能反），并回收协议实例
                for (var ci2 = 0; ci2 < ctx.ids.length; ci2++) {
                    try { if (map.getLayer(ctx.ids[ci2])) map.removeLayer(ctx.ids[ci2]); } catch (ce) {}
                    // 清理项: 原来 catch 内外各写一次 delete，catch 内那句是死代码
                    delete layerSlotMap[ctx.ids[ci2]];
                }
                if (sourceAdded) { try { if (map.getSource(sn)) map.removeSource(sn); } catch (ce2) {} }
                releaseProtocol(key);
                delete loadedSources[sn];
                throw e;
            }
        }

        function unloadSource(sn) {
            var entry = loadedSources[sn];
            if (entry) {
                for (var i = 0; i < entry.ids.length; i++) {
                    try { if (map.getLayer(entry.ids[i])) map.removeLayer(entry.ids[i]); } catch (e) {}
                    delete layerSlotMap[entry.ids[i]];
                }
                if (entry.key) { releaseProtocol(entry.key); }
            }
            try { if (map.getSource(sn)) map.removeSource(sn); } catch (e) {}
            delete loadedSources[sn];
        }

        /* ============================================================
           Viewport
        ============================================================ */
        // O6: 样式未就绪时的重试。计数器只在「本次调用确实发起了一次重试」时自增，
        // 且每个调度批次独立计数——避免高频调用（file-drop 的透明 input 覆盖整个投放区，
        // 鼠标移动会持续触发）把 10 次预算在一次样式切换内烧光，导致视口刷新永久丢失。
        var vpRetries = 0;
        var vpRetryTimer = null;
        function updateViewport() {
            if (!allEntries.length) return;
            if (!map.isStyleLoaded()) {
                if (vpRetryTimer !== null) return;
                if (vpRetries >= 10) return;
                vpRetries++;
                vpRetryTimer = setTimeout(function () {
                    vpRetryTimer = null;
                    updateViewport();
                }, 200);
                return;
            }
            vpRetries = 0;
            if (vpRetryTimer !== null) { clearTimeout(vpRetryTimer); vpRetryTimer = null; }

            var z = map.getZoom();
            var b = map.getBounds();
            var vp = [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()];
            var pad = Math.max((vp[2] - vp[0]) * 0.5, 1.0);
            var pv = [vp[0] - pad, vp[1] - pad, vp[2] + pad, vp[3] + pad];

            var candidates = [];
            for (var i = 0; i < allEntries.length; i++) {
                var entry = allEntries[i];
                if (z >= entry.header.minZoom - 1 && boundsIntersect(entry.bounds, pv)) {
                    candidates.push(entry);
                }
            }

            // O1: 按与视口的相交面积降序，优先保证大面积覆盖视口的源，避免视口内出现空白
            candidates.sort(function (a, b) {
                return intersectArea(b.bounds, pv) - intersectArea(a.bounds, pv);
            });
            if (candidates.length > MAX_ACTIVE_SOURCES) candidates.length = MAX_ACTIVE_SOURCES;

            var wantSet = {};
            for (var ci = 0; ci < candidates.length; ci++) wantSet[candidates[ci].sourceName] = true;

            var loaded = 0;
            for (var wi = 0; wi < candidates.length; wi++) {
                var e = candidates[wi];
                if (!loadedSources[e.sourceName]) {
                    try {
                        loadEntry(e);
                        if (!vcmVisible && e.type === "vcm") {
                            var lids = loadedSources[e.sourceName].ids;
                            for (var li = 0; li < lids.length; li++) {
                                try { map.setLayoutProperty(lids[li], "visibility", "none"); } catch (ex) {}
                            }
                        }
                        loaded++;
                    } catch (err) { unloadSource(e.sourceName); dbg("Load fail: " + e.sourceName + ": " + err.message, "dbg-err"); }
                }
            }

            var toRemove = [];
            for (var sn in loadedSources) { if (!wantSet[sn]) toRemove.push(sn); }
            for (var ri = 0; ri < toRemove.length; ri++) unloadSource(toRemove[ri]);

            if (loaded > 0 || toRemove.length > 0) {
                // P1-2: 整批只重排一次（原在 loadEntry 内，每层触发一次全量 moveLayer）
                reorderLayers();
                // P1-3: 源有增删，重建可 hover 图层缓存
                refreshHoverableLayers();
                dbg("Z" + z.toFixed(1) + " | +" + loaded + " -" + toRemove.length + " | " + Object.keys(loadedSources).length + " active", "dbg-info");
            }

            updateStats();
        }

        /* ============================================================
           Index Folder
        ============================================================ */
        async function indexFolder(files) {
            if (loadingActive) return;
            var statusEl = document.getElementById("main-status");
            var progress = document.getElementById("progress-bar");
            var progressFill = document.getElementById("progress-fill");
            var progressPct = document.getElementById("progress-pct");
            var fileDrop = document.getElementById("file-drop");
            var btnClearAll = document.getElementById("btn-clear-all");

            var newCount = 0, skipCount = 0, errCount = 0;
            var totalNew = 0;
            for (var fi = 0; fi < files.length; fi++) {
                var fn = files[fi].name.toLowerCase();
                // P1-5: key 统一经 normalizePathKey，重复判定走 isKnownPath（可与拖拽通道
                // 的完整路径互相识别）；M1+O2: 与主循环口径一致，detectType 无法识别不计入，
                // 避免进度卡在 <100%
                var fkey = normalizePathKey(files[fi].webkitRelativePath || files[fi].name);
                if ((fn.endsWith(".t") || fn.endsWith(".pmtiles")) && !isKnownPath(fkey) && detectType(files[fi])) totalNew++;
            }

            if (!totalNew) {
                statusEl.innerHTML = '<span class="dim">全部重复，无新文件</span>';
                dbg("All " + files.length + " files duplicated", "dbg-warn");
                btnClearAll.style.display = accumulatedFiles.length ? "block" : "none";
                return;
            }

            var wasEmpty = allEntries.length === 0;

            dbg("Scanning " + totalNew + " new files (" + (accumulatedFiles.length) + " existing)...");
            fileDrop.classList.add("has-file");
            btnClearAll.style.display = "block";

            statusEl.innerHTML = '<span class="dim">扫描中...</span>';
            progressFill.style.width = "0%";
            progress.style.display = "block";
            setLoading(true, "扫描中...");

            var vcmCount = 0, vsmCount = 0, genericCount = 0;
            var processed = 0;

            for (var idx = 0; idx < files.length; idx++) {
                var file = files[idx];
                if (!file.name.toLowerCase().endsWith(".t") && !file.name.toLowerCase().endsWith(".pmtiles")) continue;
                var fileKey = normalizePathKey(file.webkitRelativePath || file.name);
                if (isKnownPath(fileKey)) { skipCount++; continue; }

                var type = detectType(file);
                if (!type) continue;

                try {
                    var inst = new pmtiles.PMTiles(new pmtiles.FileSource(file));
                    var header = await inst.getHeader();
                    var meta = await inst.getMetadata();
                    var sn = type + "_" + file.name.replace(/\.(t|pmtiles)$/i, "");

                    accumulatedFiles.push(file);
                    accumulatedNames[fileKey] = true;

                    allEntries.push({
                        file: file, header: header, meta: meta,
                        bounds: [header.minLon, header.minLat, header.maxLon, header.maxLat],
                        sourceName: sn, type: type
                    });

                    if (type === "vcm") vcmCount++;
                    else if (type === "vsm") vsmCount++;
                    else genericCount++;
                    newCount++;
                } catch (e) {
                    errCount++;
                    if (errCount <= 3) dbg("Fail: " + file.name + ": " + e.message, "dbg-err");
                }

                processed++;
                if (processed % 10 === 0 || processed === totalNew) {
                    var pct = Math.round((processed / totalNew) * 100);
                    progressFill.style.width = pct + "%";
                    progressPct.textContent = pct + "%";
                    statusEl.innerHTML = '<span class="dim">扫描 ' + processed + "/" + totalNew + "</span>";
                    await yieldUI();
                }
            }

            progress.style.display = "none";
            fileDrop.querySelector(".drop-text").textContent = "已选择文件夹";
            fileDrop.querySelector(".drop-hint").textContent = accumulatedFiles.length + " 个文件（共 " + allEntries.length + " 条）";
            statusEl.innerHTML = '<span class="ok">+' + newCount + " VCM=" + vcmCount + " VSM=" + vsmCount + (genericCount ? " Other=" + genericCount : "") +
                (skipCount ? " · 跳过 " + skipCount + " 重复" : "") +
                (errCount ? " · " + errCount + " 失败" : "") + "</span>";
            setLoading(false, "Ready");
            dbg("Added " + newCount + ", skipped " + skipCount + ", total " + allEntries.length + " entries", "dbg-ok");

            if (wasEmpty && allEntries.length > 0) {
                var minLon = 180, minLat = 90, maxLon = -180, maxLat = -90;
                for (var ei = 0; ei < allEntries.length; ei++) {
                    var eb = allEntries[ei].bounds;
                    if (eb[0] < minLon) minLon = eb[0];
                    if (eb[1] < minLat) minLat = eb[1];
                    if (eb[2] > maxLon) maxLon = eb[2];
                    if (eb[3] > maxLat) maxLat = eb[3];
                }

                var globalMinZoom = 99;
                for (var gi = 0; gi < allEntries.length; gi++) {
                    if (allEntries[gi].header.minZoom < globalMinZoom) globalMinZoom = allEntries[gi].header.minZoom;
                }

                if (minLon < maxLon) {
                    map.fitBounds([[minLon, minLat], [maxLon, maxLat]], { padding: 60, animate: false });
                    if (map.getZoom() < globalMinZoom) {
                        dbg("Zoom " + map.getZoom().toFixed(1) + " → " + globalMinZoom, "dbg-warn");
                        map.setZoom(globalMinZoom);
                    }
                }
            }

            updateViewport();
        }

        /* ============================================================
           Stats
        ============================================================ */
        function updateStats() {
            var n = 0; for (var k in loadedSources) n++;
            document.getElementById("stat-indexed").textContent = allEntries.length;
            document.getElementById("stat-active").textContent = n;
            document.getElementById("stat-zoom").textContent = "Z" + map.getZoom().toFixed(1);
        }

        /* ============================================================
           VCM Toggle
        ============================================================ */
        function setVCMVisible(visible) {
            vcmVisible = visible;
            for (var sn in loadedSources) {
                if (loadedSources[sn].type === "vcm") {
                    var vis = visible ? "visible" : "none";
                    for (var i = 0; i < loadedSources[sn].ids.length; i++) {
                        try {
                            if (map.getLayer(loadedSources[sn].ids[i])) {
                                map.setLayoutProperty(loadedSources[sn].ids[i], "visibility", vis);
                            }
                        } catch (e) {}
                    }
                }
            }
        }

        document.getElementById("vcm-toggle").addEventListener("change", function (e) {
            setVCMVisible(e.target.checked);
        });

        /* ============================================================
           Events
        ============================================================ */
        var moveTimer;
        // M3: moveend 与 zoomend 共用同一 debounce，一次缩放只触发一次视口更新
        function scheduleViewport() {
            clearTimeout(moveTimer);
            moveTimer = setTimeout(updateViewport, 200);
        }
        map.on("moveend", scheduleViewport);
        map.on("zoomend", scheduleViewport);

        /* Info Panel */
        var infoPanel = document.getElementById("info-panel");
        var infoTable = document.getElementById("info-table");
        var lastProps = "";

        document.getElementById("info-close").onclick = function () { infoPanel.style.display = "none"; };

        map.on("click", function (e) {
            var features = map.queryRenderedFeatures(e.point);
            if (!features.length) { infoPanel.style.display = "none"; return; }
            // O4: 优先展示线/点/标注要素，避免半透明 fill 在点击时盖住更具体的要素
            var f = features[0];
            for (var fi2 = 0; fi2 < features.length; fi2++) {
                var lid2 = (features[fi2].layer && features[fi2].layer.id) ? features[fi2].layer.id : "";
                // 清理项: 原写法 indexOf("_fill") !== length - 5 语义绕且依赖长度，
                // 直接取尾部 5 字符比较更直白、无边界歧义
                if (lid2.slice(-5) !== "_fill") { f = features[fi2]; break; }
            }
            var rows = '<tr><td>source</td><td>' + escapeHtml(f.source) + "</td></tr>" +
                '<tr><td>layer</td><td>' + escapeHtml(f.sourceLayer || "-") + "</td></tr>" +
                '<tr><td>type</td><td>' + escapeHtml(f.geometry.type) + "</td></tr>";
            var keys = Object.keys(f.properties);
            lastProps = "";
            for (var i = 0; i < keys.length; i++) {
                var pv = f.properties[keys[i]];
                rows += '<tr><td>' + escapeHtml(keys[i]) + "</td><td>" + escapeHtml(pv) + "</td></tr>";
                lastProps += keys[i] + ": " + pv + "\n";
            }
            infoTable.innerHTML = rows;
            infoPanel.style.display = "block";
        });

        document.getElementById("btn-copy-props").onclick = function () {
            if (!lastProps) return;
            var btn = document.getElementById("btn-copy-props");
            copyText(lastProps).then(function (ok) {
                btn.textContent = ok === false ? "复制失败" : "已复制";
                setTimeout(function () { btn.textContent = "复制全部"; }, 1200);
            });
        };

        /* Hover —— P0-1/P1-3: 整段移除。
           原实现把 hover 要素写入 feature-state，但唯一读取它的图层（VCM 等高线）
           用高程 F 当 id，实测会跨瓦片串扰点亮所有同高程线，已随 promoteId 一并去掉。
           光标反馈已合并进状态栏那个 mousemove（见「Status Bar: Coordinates」）。
           注意：VSM 的 promoteId（E）与 generic 一样保留，只是目前没有图层消费它。 */

        /* Folder Input */
        var folderInput = document.getElementById("folder-input");
        folderInput.addEventListener("change", function (e) {
            if (e.target.files.length) {
                var snapshot = Array.from(e.target.files);
                e.target.value = "";
                indexFolder(snapshot);
            }
        });

        /* Tauri Native Drag & Drop */
        var fileDrop = document.getElementById("file-drop");
        var tauriAvailable = !!(window.__TAURI__ && window.__TAURI__.event);

        if (tauriAvailable) {
            var listen = window.__TAURI__.event.listen;
            listen("tauri://drag-enter", function () {
                fileDrop.classList.add("drag-over");
            });
            listen("tauri://drag-leave", function () {
                fileDrop.classList.remove("drag-over");
            });
            listen("tauri://drag-drop", function (event) {
                fileDrop.classList.remove("drag-over");
                var paths = (event.payload && event.payload.paths) || [];
                if (!paths.length) return;
                loadDroppedPaths(paths);
            });
        }

        function loadDroppedPaths(paths) {
            dbg("Drag-drop: " + paths.length + " items");
            var allFilePaths = [];
            var pending = paths.length;

            for (var i = 0; i < paths.length; i++) {
                (function(p) {
                    window.__TAURI__.core.invoke("read_path_as_files", { path: p }).then(function (filePathList) {
                        for (var j = 0; j < filePathList.length; j++) {
                            allFilePaths.push(filePathList[j]);
                        }
                        if (--pending === 0 && allFilePaths.length) indexDroppedPaths(allFilePaths);
                    }).catch(function (err) {
                        dbg("Scan fail: " + p + ": " + err, "dbg-err");
                        if (--pending === 0 && allFilePaths.length) indexDroppedPaths(allFilePaths);
                    });
                })(paths[i]);
            }
        }

        async function indexDroppedPaths(filePaths) {
            // P0-3: 与 indexFolder 对称的重入守卫。扫描期间 UI 仍可接收拖放，
            // 缺守卫会让两个索引循环并发：进度条互相覆盖、状态文案打架，
            // 且双方都判定 wasEmpty 为 true，从而各 fitBounds 一次，视野跳两下。
            if (loadingActive) {
                dbg("扫描进行中，忽略本次拖入", "dbg-warn");
                return;
            }
            var statusEl = document.getElementById("main-status");
            var progress = document.getElementById("progress-bar");
            var progressFill = document.getElementById("progress-fill");
            var progressPct = document.getElementById("progress-pct");
            var fileDropEl = document.getElementById("file-drop");
            var btnClearAll = document.getElementById("btn-clear-all");

            // H3: 记录入口是否为空，仅首次加载才调整视图，避免追加文件时重置用户视野
            var wasEmpty = allEntries.length === 0;

            // P1-5: 与文件夹通道共用归一化 key 与后缀判定（见 normalizePathKey 注释），
            // 使「先选文件夹、再拖入同一文件夹」不会把同一文件索引两次。
            // O2: 完整路径去重，同名不同目录不再误判为重复。
            var newPaths = [];
            for (var pi = 0; pi < filePaths.length; pi++) {
                if (!isKnownPath(normalizePathKey(filePaths[pi]))) newPaths.push(filePaths[pi]);
            }

            if (!newPaths.length) {
                statusEl.innerHTML = '<span class="dim">全部重复，无新文件</span>';
                dbg("All dropped files duplicated", "dbg-warn");
                return;
            }

            dbg("Scanning " + newPaths.length + " new dropped files (" + allEntries.length + " existing)...");
            fileDropEl.classList.add("has-file");
            btnClearAll.style.display = "block";

            statusEl.innerHTML = '<span class="dim">扫描中...</span>';
            progress.style.display = "block";
            setLoading(true, "扫描中...");

            var vcmCount = 0, vsmCount = 0, genericCount = 0;
            var globalMinZoom = 99;
            var newCount = 0, errCount = 0;

            for (var idx = 0; idx < newPaths.length; idx++) {
                var fullPath = newPaths[idx];
                var fileName = fullPath.replace(/^.*[\\\/]/, "");

                if (isKnownPath(normalizePathKey(fullPath))) continue;

                var fakeFile = { name: fileName, webkitRelativePath: "", _dropPath: fullPath };
                var type = detectType(fakeFile);
                if (!type) continue;

                try {
                    var diskSource = new DiskSource(fullPath);
                    var inst = new pmtiles.PMTiles(diskSource);
                    var header = await inst.getHeader();
                    var meta = await inst.getMetadata();
                    var sn = type + "_" + fileName.replace(/\.(t|pmtiles)$/i, "");

                    accumulatedNames[normalizePathKey(fullPath)] = true;

                    allEntries.push({
                        diskPath: fullPath, header: header, meta: meta,
                        bounds: [header.minLon, header.minLat, header.maxLon, header.maxLat],
                        sourceName: sn, type: type
                    });

                    if (header.minZoom < globalMinZoom) globalMinZoom = header.minZoom;
                    if (type === "vcm") vcmCount++;
                    else if (type === "vsm") vsmCount++;
                    else genericCount++;
                    newCount++;
                } catch (e) {
                    errCount++;
                    var errMsg = (e && e.message) ? e.message : String(e || "unknown");
                    if (errCount <= 5) dbg("Fail: " + fileName + ": " + errMsg, "dbg-err");
                }

                if (idx % 20 === 0 || idx === newPaths.length - 1) {
                    var pct = Math.round(((idx + 1) / newPaths.length) * 100);
                    progressFill.style.width = pct + "%";
                    progressPct.textContent = pct + "%";
                    statusEl.innerHTML = '<span class="dim">扫描 ' + (idx + 1) + "/" + newPaths.length + "</span>";
                    await yieldUI();
                }
            }

            progress.style.display = "none";
            fileDropEl.querySelector(".drop-text").textContent = "已选择文件夹";
            fileDropEl.querySelector(".drop-hint").textContent = allEntries.length + " 个文件";
            statusEl.innerHTML = '<span class="ok">+' + newCount + " VCM=" + vcmCount + " VSM=" + vsmCount + (genericCount ? " Other=" + genericCount : "") +
                (errCount ? " · " + errCount + " 失败" : "") + "</span>";
            setLoading(false, "Ready");
            dbg("Done: +" + newCount + " entries, total=" + allEntries.length, "dbg-ok");

            if (wasEmpty) {
                var minLon = 180, minLat = 90, maxLon = -180, maxLat = -90;
                for (var ei = 0; ei < allEntries.length; ei++) {
                    var eb = allEntries[ei].bounds;
                    if (eb[0] < minLon) minLon = eb[0];
                    if (eb[1] < minLat) minLat = eb[1];
                    if (eb[2] > maxLon) maxLon = eb[2];
                    if (eb[3] > maxLat) maxLat = eb[3];
                }

                if (minLon < maxLon) {
                    map.fitBounds([[minLon, minLat], [maxLon, maxLat]], { padding: 60, animate: false });
                    if (map.getZoom() < globalMinZoom) {
                        dbg("Zoom " + map.getZoom().toFixed(1) + " → " + globalMinZoom, "dbg-warn");
                        map.setZoom(globalMinZoom);
                    }
                }
            }

            updateViewport();
        }

        /* Clear All */
        document.getElementById("btn-clear-all").onclick = function () {
            for (var s in loadedSources) unloadSource(s);
            allEntries = [];
            accumulatedFiles = [];
            accumulatedNames = {};
            // 清理项: 原来不收尾这些状态，清除后面板可能残留已删除源的属性、
            // hoverableLayers 仍指向已移除的图层、光标停留在 pointer
            infoPanel.style.display = "none";
            lastProps = "";
            hoverableLayers = [];
            lastCursor = "";
            try { map.getCanvas().style.cursor = ""; } catch (e) {}
            document.getElementById("file-drop").classList.remove("has-file");
            document.getElementById("file-drop").querySelector(".drop-text").textContent = "点击选择文件夹";
            document.getElementById("file-drop").querySelector(".drop-hint").textContent = "支持 VCM / VSM 子目录及 .pmtiles 文件";
            document.getElementById("main-status").innerHTML = "";
            document.getElementById("btn-clear-all").style.display = "none";
            document.getElementById("stat-indexed").textContent = "0";
            document.getElementById("stat-active").textContent = "0";
            updateViewport();
            dbg("All files cleared", "dbg-info");
        };
    })();
    </script>
</body>
</html>
