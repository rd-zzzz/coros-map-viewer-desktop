[package]
name = "map-app"
version = "0.2.1"
edition = "2021"

[lib]
name = "map_app_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# P1-1: 供 read_file_slice 以 base64 文本返回字节（0.22.1 已在 Cargo.lock 中，可离线解析）
base64 = "0.22"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
